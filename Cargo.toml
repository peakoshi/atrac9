[package]
name = "atrac9"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "A safe, allocation-free ATRAC9 audio decoder in pure Rust"
license = "MIT"
repository = "https://github.com/peakoshi/atrac9"
readme = "README.md"
keywords = ["atrac9", "at9", "audio", "codec", "decoder"]
categories = ["multimedia::audio", "multimedia::encoding"]
include = ["/src", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "decode"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
